services:
  - type: web
    name: tracex-backend
    runtime: node
    plan: free
    region: oregon
    rootDir: Backend
    buildCommand: npm install
    startCommand: node src/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLIENT_ORIGIN
        value: "*"
      - key: JWT_SECRET
        generateValue: true
